name: MGD reader reasoning budget experiment
on:
  push:
    branches: ['codex/mgd-predictive-04217']
    paths: ['mgd_reader_budget440.py', '.github/workflows/mgd-reader-budget440.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        budget: [768, 1024]
    env:
      MGD_THINKING_BUDGET: ${{ matrix.budget }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install litert-lm==0.18.0 huggingface_hub
      - run: python mgd_reader_budget440.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-reader-budget-${{ matrix.budget }}
          path: mgd-reader-budget-results
