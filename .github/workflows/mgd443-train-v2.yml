name: MGD 443 factorized entity reader training
on:
  push:
    branches: ['codex/mgd-predictive-04217']
    paths: ['research/mgd443_reader/train_v2.py', '.github/workflows/mgd443-train-v2.yml']
permissions:
  contents: read
concurrency:
  group: mgd443-training-v2
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python research/mgd443_reader/train_v2.py --epochs 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-443-factorized-reader-training
          path: |
            research/mgd443_reader/results_v2/reader443.json
            research/mgd443_reader/results_v2/training-results.json
            research/mgd443_reader/results_v2/reserved_curriculum.json
            research/mgd443_reader/results_v2/checkpoint.pt
          if-no-files-found: error
