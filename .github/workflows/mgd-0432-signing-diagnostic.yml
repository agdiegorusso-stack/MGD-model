name: MGD 0432 signing diagnostic
on:
  push:
    branches: ['codex/mgd-studio-axioms-0430']
    paths: ['.github/workflows/mgd-0432-signing-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-axioms-signing-v1
      - name: Inspect only public certificate metadata
        env:
          MGD_KEYSTORE_BASE64: ${{ secrets.MGD_KEYSTORE_BASE64 }}
          MGD_STORE_PASSWORD: ${{ secrets.MGD_STORE_PASSWORD }}
          MGD_KEY_ALIAS: ${{ secrets.MGD_KEY_ALIAS }}
          MGD_KEY_PASSWORD: ${{ secrets.MGD_KEY_PASSWORD }}
        run: python3 delivery0432/signing_guard.py
      - name: List recovery metadata without downloading or publishing keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mgd-neural-0421/tool/reports
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --paginate --jq '.actions_caches[] | {key,ref,created_at,last_accessed_at,size_in_bytes}' > mgd-neural-0421/tool/reports/cache-metadata0432.jsonl
          python3 - <<'PY'
          import os,json,pathlib
          paths=[pathlib.Path.home()/'.android',pathlib.Path.home()/'.config/.android']
          report={'android_user_home':os.environ.get('ANDROID_USER_HOME'),'android_sdk_home':os.environ.get('ANDROID_SDK_HOME'),'existing_debug_key_paths':[str(p) for root in paths if root.exists() for p in root.rglob('debug.keystore')]}
          pathlib.Path('mgd-neural-0421/tool/reports/paths0432.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-0432-signing-public-diagnostic
          path: |
            mgd-neural-0421/tool/reports/signing-preflight0432.json
            mgd-neural-0421/tool/reports/cache-metadata0432.jsonl
            mgd-neural-0421/tool/reports/paths0432.json
          if-no-files-found: error
