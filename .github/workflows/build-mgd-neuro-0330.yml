name: MGD Neuro 0.34.0 - Complementary memory and multimodal atlas
on:
  pull_request:
    branches: [mgd-neuro-mobile]
    paths:
      - 'mgd-neuro-app/**'
      - '.github/workflows/build-mgd-neuro-0330.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mgd-cls-0340-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-neuro-prototype-signing-v1
      - name: Check signing continuity
        run: python3 mgd-neuro/v0315/ci.py signing
      - name: Generate Android project and permissions
        run: python3 mgd-neuro/v0315/ci.py platform
      - name: Materialize guarded integration and native audio channel
        run: |
          set -euo pipefail
          python3 mgd-neuro-app/tool/integrate_cls_0340.py
          sed -i 's/Memorie MGD 0.33.1/Memorie MGD 0.34.0/g' mgd-neuro-app/integration_test/runtime_android_v0319_test.dart
          dart format mgd-neuro-app/lib/cls_*.dart mgd-neuro-app/test/cls_v0340_test.dart mgd-neuro-app/integration_test/cls_android_v0340_test.dart
      - name: Dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get
      - name: Record integrated source revision
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = 'codex/mgd-cls-0340'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mgd-neuro-app/lib mgd-neuro-app/test mgd-neuro-app/integration_test mgd-neuro-app/pubspec.yaml mgd-neuro-app/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'feat(cls): materialize integrated runtime and lock verified dependencies [skip ci]'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          git rev-parse HEAD > mgd-neuro-app/BUILD-COMMIT.txt
      - name: Unit widget SQLite and mathematical regressions
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          MGD_CLS_BENCHMARK_OUT=benchmark-0.34.0.json flutter test --reporter expanded 2>&1 | tee tests-0.34.0.log
      - name: Existing one-pass learning benchmark
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          MGD_BENCHMARK_OUT=benchmark-existing-0.34.0.json flutter test tool/learning_benchmark_v0321_test.dart --reporter expanded 2>&1 | tee benchmark-0.34.0.log
      - name: Static analysis
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze-0.34.0.log
      - name: Enable Android KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android baseline and CLS lifecycle integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/runtime_android_v0319_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-baseline-0.34.0.log'
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/cls_android_v0340_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-cls-0.34.0.log'
      - name: Build signed release APK
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter build apk --release --build-name 0.34.0 --build-number 66 2>&1 | tee build-0.34.0.log
      - name: Verify identity and stable certificate
        run: |
          set -euo pipefail
          APK=mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -1 > mgd-neuro-app/APK-VERSION.txt
          grep -F "name='it.diegorusso.mgdneurostable'" mgd-neuro-app/APK-VERSION.txt
          grep -F "versionName='0.34.0'" mgd-neuro-app/APK-VERSION.txt
          grep -F "versionCode='66'" mgd-neuro-app/APK-VERSION.txt
          "$SIGN" verify --verbose --print-certs "$APK" > mgd-neuro-app/APK-SIGNATURE.txt
          grep -Fi 'bfd6e2660a3c3a6e3b37d1736e1619777b933e976c312c5b1c6cd38e908f1589' mgd-neuro-app/APK-SIGNATURE.txt
          sha256sum "$APK" > mgd-neuro-app/APK-SHA256.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.34.0-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload exact integrated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.34.0-source
          path: |
            mgd-neuro-app/lib
            mgd-neuro-app/test
            mgd-neuro-app/integration_test
            mgd-neuro-app/tool
            mgd-neuro-app/android/app/src/main
            mgd-neuro-app/pubspec.yaml
            mgd-neuro-app/pubspec.lock
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.34.0-reports
          path: |
            mgd-neuro-app/*-0.34.0.log
            mgd-neuro-app/*-0.34.0.json
            mgd-neuro-app/APK-*.txt
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
