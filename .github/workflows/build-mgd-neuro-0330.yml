name: MGD Neuro 0.41.0 - Social cognition and dialogue
on:
  pull_request:
    branches: [mgd-neuro-mobile]
    paths: ['mgd-neuro-app/**', 'mgd-neuro/v0350/**', 'mgd-neuro/v0351/**', 'mgd-neuro/v0400/**', '.github/workflows/build-mgd-neuro-0330.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mgd-social-dialogue-0410-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate and materialize reviewed closed-book source
        run: python3 mgd-neuro/v0350/materialize.py mgd-neuro-app
      - name: Restore Gradle dependencies
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mgd-gradle-${{ runner.os }}-flutter3475-v1
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-neuro-prototype-signing-v1
      - name: Check signing continuity
        run: python3 mgd-neuro/v0315/ci.py signing
      - name: Generate Android project preserving native audio
        run: |
          set -euo pipefail
          cp mgd-neuro-app/android/app/src/main/kotlin/it/diegorusso/mgd_neuro_mobile/MainActivity.kt /tmp/mgd-main-activity.kt
          python3 mgd-neuro/v0315/ci.py platform
          cp /tmp/mgd-main-activity.kt mgd-neuro-app/android/app/src/main/kotlin/it/diegorusso/mgd_neuro_mobile/MainActivity.kt
      - name: Dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get
      - name: Record exact integrated source revision
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = 'codex/mgd-closed-book-0350'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mgd-neuro-app/lib mgd-neuro-app/test mgd-neuro-app/integration_test mgd-neuro-app/tool mgd-neuro-app/pubspec.yaml mgd-neuro-app/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'feat(memory): materialize verified closed-book implementation [skip ci]'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          git rev-parse HEAD > mgd-neuro-app/BUILD-COMMIT.txt
      - name: Unit widget SQLite and all previous regression tests
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          MGD_CLS_BENCHMARK_OUT=benchmark-cls-0.41.0.json flutter test --reporter expanded 2>&1 | tee tests-0.41.0.log
      - name: Existing one-pass learning benchmark
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          MGD_BENCHMARK_OUT=benchmark-existing-0.41.0.json flutter test tool/learning_benchmark_v0321_test.dart --reporter expanded 2>&1 | tee benchmark-existing-0.41.0.log
      - name: Previous archive-reader development evaluation
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          MGD_BOOK_EVAL_OUT=benchmark-book-0.41.0.json flutter test tool/book_eval_v0342_test.dart --reporter expanded 2>&1 | tee benchmark-book-0.41.0.log
      - name: Closed-book and novel-Italian development evaluation including failures
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          MGD_CLOSED_EVAL_OUT=benchmark-closed-0.41.0.json flutter test tool/closed_book_eval_v0350_test.dart --reporter expanded 2>&1 | tee benchmark-closed-0.41.0.log
      - name: Static analysis
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze-0.41.0.log
      - name: Publish evaluation diagnostics before Android
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.41.0-evaluation
          path: |
            mgd-neuro-app/*-0.41.0.log
            mgd-neuro-app/*-0.41.0.json
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
      - name: Enable Android KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android closed-book stress and all previous lifecycle regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/closed_book_android_v0350_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-closed-0.41.0.log'
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/book_understanding_android_v0342_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-understanding-0.41.0.log'
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/runtime_android_v0319_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-baseline-0.41.0.log'
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/cls_android_v0340_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-cls-0.41.0.log'
            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/book_android_v0341_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-book-0.41.0.log'\n            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/cognitive_core_android_v0400_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-cognitive-0.41.0.log'\n            cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/social_dialogue_android_v0410_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-social-dialogue-0.41.0.log'
      - name: Build signed release APK
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter build apk --release --build-name 0.41.0 --build-number 81 2>&1 | tee build-0.41.0.log
      - name: Verify identity and stable certificate
        run: |
          set -euo pipefail
          APK=mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          head -1 /tmp/badging.txt > mgd-neuro-app/APK-VERSION.txt
          grep -F "name='it.diegorusso.mgdneurostable'" mgd-neuro-app/APK-VERSION.txt
          grep -F "versionName='0.41.0'" mgd-neuro-app/APK-VERSION.txt
          grep -F "versionCode='81'" mgd-neuro-app/APK-VERSION.txt
          "$SIGN" verify --verbose --print-certs "$APK" > mgd-neuro-app/APK-SIGNATURE.txt
          grep -Fi 'bfd6e2660a3c3a6e3b37d1736e1619777b933e976c312c5b1c6cd38e908f1589' mgd-neuro-app/APK-SIGNATURE.txt
          sha256sum "$APK" > mgd-neuro-app/APK-SHA256.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.41.0-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Save downloaded Gradle dependencies
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mgd-gradle-${{ runner.os }}-flutter3475-v1
      - name: Upload exact integrated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.41.0-source
          path: |
            mgd-neuro-app/lib
            mgd-neuro-app/test
            mgd-neuro-app/integration_test
            mgd-neuro-app/tool
            mgd-neuro-app/android/app/src/main
            mgd-neuro-app/android/app/build.gradle.kts
            mgd-neuro-app/android/settings.gradle.kts
            mgd-neuro-app/android/build.gradle.kts
            mgd-neuro-app/analysis_options.yaml
            mgd-neuro-app/pubspec.yaml
            mgd-neuro-app/pubspec.lock
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.41.0-reports
          path: |
            mgd-neuro-app/*-0.41.0.log
            mgd-neuro-app/*-0.41.0.json
            mgd-neuro-app/APK-*.txt
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
