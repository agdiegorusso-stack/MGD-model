name: MGD Neuro 0.31.9 - Runtime and Android restart
on:
  push:
    branches: [mgd-neuro-mobile]
    paths:
      - 'mgd-neuro/v0319/**'
      - '.github/workflows/build-mgd-neuro-0319.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mgd-runtime-0319-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-neuro-prototype-signing-v1
      - name: Check signing continuity
        run: python3 mgd-neuro/v0315/ci.py signing
      - name: Restore exact production 0.31.8 source
        uses: actions/download-artifact@v4
        with:
          name: MGD-Neuro-0.31.8-source
          run-id: 36142934053
          github-token: ${{ github.token }}
          path: mgd-neuro-app
      - name: Apply checked runtime patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,json,hashlib
          folder=Path('mgd-neuro/v0319')
          raw=base64.b64decode((folder/'bundle.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='08c5b1462645d0646fe22a9ab9f7042524fb280a07b1215a2d24da315ba53d20'
          out=folder/'expanded';out.mkdir(exist_ok=True)
          for name,text in json.loads(gzip.decompress(raw)).items():
            assert Path(name).name==name
            (out/name).write_text(text)
          PY
          python3 mgd-neuro/v0319/expanded/apply.py mgd-neuro-app
          if test -f mgd-neuro/v0319/fixes.py; then python3 mgd-neuro/v0319/fixes.py mgd-neuro-app; fi
          git rev-parse HEAD > mgd-neuro-app/BUILD-COMMIT.txt
      - name: Generate Android project and permissions
        run: python3 mgd-neuro/v0315/ci.py platform
      - name: Dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get
      - name: Unit and widget runtime regressions
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee tests-0.31.9.log
      - name: Static analysis
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze-0.31.9.log
      - name: Enable Android KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android SQLite lifecycle and corrupt-load protection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: cd mgd-neuro-app && bash -o pipefail -c 'flutter test integration_test/runtime_android_v0319_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee android-0.31.9.log'
      - name: Build signed release APK after Android passes
        working-directory: mgd-neuro-app
        run: |
          set -o pipefail
          flutter build apk --release --build-name 0.31.9 --build-number 58 2>&1 | tee build-0.31.9.log
      - name: Verify release identity and stable certificate
        run: |
          set -euo pipefail
          APK=mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -1 > mgd-neuro-app/APK-VERSION.txt
          grep -F "name='it.diegorusso.mgdneurostable'" mgd-neuro-app/APK-VERSION.txt
          grep -F "versionName='0.31.9'" mgd-neuro-app/APK-VERSION.txt
          grep -F "versionCode='58'" mgd-neuro-app/APK-VERSION.txt
          "$SIGN" verify --verbose --print-certs "$APK" > mgd-neuro-app/APK-SIGNATURE.txt
          grep -Fi 'bfd6e2660a3c3a6e3b37d1736e1619777b933e976c312c5b1c6cd38e908f1589' mgd-neuro-app/APK-SIGNATURE.txt
          sha256sum "$APK" > mgd-neuro-app/APK-SHA256.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.31.9-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload exact sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.31.9-source
          path: |
            mgd-neuro-app/lib
            mgd-neuro-app/test
            mgd-neuro-app/integration_test
            mgd-neuro-app/tool
            mgd-neuro-app/pubspec.yaml
            mgd-neuro-app/pubspec.lock
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.31.9-reports
          path: |
            mgd-neuro-app/*-0.31.9.log
            mgd-neuro-app/APK-*.txt
            mgd-neuro-app/BUILD-COMMIT.txt
          retention-days: 30
