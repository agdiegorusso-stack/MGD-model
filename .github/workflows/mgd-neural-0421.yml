name: MGD Neural 0.42.1 installable APK

on:
  push:
    branches: ['codex/mgd-neural-0421-restore']
    paths: ['mgd-neural-0421/**', '.github/workflows/mgd-neural-0421.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgd-neural-0421-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mgd-neural-0421
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/debug.keystore
          key: mgd-neural-0420-android-gradle-9.3.1-v1
      - name: Build and run unit tests
        run: bash tool/build_android.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/debug.keystore
          key: mgd-neural-0420-android-gradle-9.3.1-v1
      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          mgd_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$mgd_tools/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee tool/reports/signature.txt
          "$mgd_tools/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > tool/reports/apk-identity.txt
          grep -F "name='it.diegorusso.mgdneurostable' versionCode='83' versionName='0.42.1'" tool/reports/apk-identity.txt
          printf '%s\n' "$GITHUB_SHA" > tool/reports/BUILD-COMMIT.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android installation and lifecycle test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: mgd-neural-0421
          script: bash tool/android_verify_421.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Neural-0.42.1-APK
          path: mgd-neural-0421/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Neural-0.42.1-verification
          path: mgd-neural-0421/tool/reports
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Neural-0.42.1-tested-source
          path: |
            mgd-neural-0421/lib
            mgd-neural-0421/test
            mgd-neural-0421/integration_test
            mgd-neural-0421/pubspec.yaml
            mgd-neural-0421/pubspec.lock
            mgd-neural-0421/android
            mgd-neural-0421/tool
            mgd-neural-0421/README.md
            mgd-neural-0421/docs
            mgd-neural-0421/analysis_options.yaml
          retention-days: 30
          overwrite: true
