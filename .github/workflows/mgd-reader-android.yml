name: MGD local reader Android execution
on:
  push:
    branches: ['codex/mgd-predictive-04217']
    paths: ['mgd_reader_native_diagnostic439.dart', 'mgd-neural-0421/integration_test/neural_reader_android_v0439_test.dart', 'mgd-neural-0421/lib/neural_reading_v0439.dart', 'mgd-neural-0421/android/app/src/main/kotlin/**', '.github/workflows/mgd-reader-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MGD_APPLICATION_ID: it.diegorusso.mgdneurostable.studio
      MGD_APPLICATION_LABEL: MGD Studio 0.42.19
    defaults:
      run:
        working-directory: mgd-neural-0421
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare model and low-memory build
        run: |
          set -euo pipefail
          pip install huggingface_hub
          python tool/prepare_neural439.py
          flutter pub get
          cp ../mgd_reader_native_diagnostic439.dart integration_test/neural_reader_diagnostic_v0439_test.dart
          sed -i 's/-Xmx4G/-Xmx2G/;s/org.gradle.workers.max=2/org.gradle.workers.max=1/;s/-Xmx1G/-Xmx512m/' android/gradle.properties
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native reader on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'cd mgd-neural-0421 && set -euo pipefail && flutter test integration_test/neural_reader_diagnostic_v0439_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee tool/reports/android-neural-reader.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-reader-Android-execution
          path: mgd-neural-0421/tool/reports
