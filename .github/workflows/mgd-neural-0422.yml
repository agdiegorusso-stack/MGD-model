name: MGD Neural 0.42.2 installable APK

on:
  push:
    branches: ['codex/mgd-neural-0422-fixes']
    paths: ['mgd-neural-0421/**', '.github/workflows/mgd-neural-0422.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mgd-neural-0421-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mgd-neural-0421
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Detect unchanged production and unit sources
        id: reuse
        run: |
          if git diff --quiet 2a530f890c4e33242cba584cd974a0f8498038fa HEAD -- \
            mgd-neural-0421/lib mgd-neural-0421/android mgd-neural-0421/assets \
            mgd-neural-0421/pubspec.yaml mgd-neural-0421/pubspec.lock \
            mgd-neural-0421/test mgd-neural-0421/tool/build_android.sh \
            mgd-neural-0421/analysis_options.yaml; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            if git diff --quiet 4a3474231df179b773968fbf3879d3a153bf9fa7 HEAD -- \
              mgd-neural-0421/lib mgd-neural-0421/android mgd-neural-0421/assets \
              mgd-neural-0421/pubspec.yaml mgd-neural-0421/pubspec.lock \
              mgd-neural-0421/test mgd-neural-0421/integration_test; then
              echo 'android=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/debug.keystore
          key: mgd-neural-0420-android-gradle-9.3.1-v1
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.enabled == 'true'
        with:
          name: MGD-Neural-0.42.2-APK
          run-id: 37606958458
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mgd-neural-0421/build/app/outputs/flutter-apk
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.enabled == 'true'
        with:
          name: MGD-Neural-0.42.2-verification
          run-id: 37606958458
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mgd-neural-0421/tool/reports
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.enabled == 'true'
        with:
          name: MGD-Neural-0.42.2-tested-source
          run-id: 37606958458
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mgd422-reuse-source
      - name: Verify reused production and prepare Android test
        if: steps.reuse.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cp ../mgd422-reuse-source/pubspec.lock pubspec.lock
          flutter pub get
          dart format lib test
          diff -qr lib ../mgd422-reuse-source/lib
          diff -qr test ../mgd422-reuse-source/test
          diff pubspec.yaml ../mgd422-reuse-source/pubspec.yaml
          if [[ '${{ steps.reuse.outputs.android }}' == 'true' ]]; then
            diff -qr integration_test ../mgd422-reuse-source/integration_test
            grep -F 'All tests passed!' tool/reports/android-test.log
          fi
          python3 - <<'PYVERIFY'
          import hashlib, pathlib
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-release.apk')
          expected = pathlib.Path('tool/reports/APK-SHA256.txt').read_text().split()[0]
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == expected
          pathlib.Path('tool/reports/REUSED-BUILD.txt').write_text(
              'APK and 382 passing unit tests: run 37604964661, commit 2a530f890c4e33242cba584cd974a0f8498038fa.\n'
              'Production and unit sources compared byte-for-byte after formatting.\n'
              'Android integration passed: run 37606958458, commit 4a3474231df179b773968fbf3879d3a153bf9fa7.\n'
              'An identical integration test may be reused; release installation and launch are always executed.\n')
          PYVERIFY
      - name: Build and run unit tests
        if: steps.reuse.outputs.enabled != 'true'
        run: bash tool/build_android.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/debug.keystore
          key: mgd-neural-0420-android-gradle-9.3.1-v1
      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          mgd_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$mgd_tools/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee tool/reports/signature.txt
          "$mgd_tools/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > tool/reports/apk-identity.txt
          grep -F "name='it.diegorusso.mgdneurostable' versionCode='84' versionName='0.42.2'" tool/reports/apk-identity.txt
          printf '%s\n' "$GITHUB_SHA" > tool/reports/BUILD-COMMIT.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android installation and lifecycle test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: mgd-neural-0421
          script: MGD_REUSE_ANDROID_TEST421='${{ steps.reuse.outputs.android }}' bash tool/android_verify_421.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Neural-0.42.2-APK
          path: mgd-neural-0421/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Neural-0.42.2-verification
          path: mgd-neural-0421/tool/reports
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Neural-0.42.2-tested-source
          path: |
            mgd-neural-0421/lib
            mgd-neural-0421/test
            mgd-neural-0421/integration_test
            mgd-neural-0421/pubspec.yaml
            mgd-neural-0421/pubspec.lock
            mgd-neural-0421/android
            mgd-neural-0421/tool
            mgd-neural-0421/README.md
            mgd-neural-0421/docs
            mgd-neural-0421/analysis_options.yaml
          retention-days: 30
          overwrite: true
