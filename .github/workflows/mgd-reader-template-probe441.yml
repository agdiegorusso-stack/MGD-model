name: MGD reader message-format diagnosis
on:
  push:
    branches: ['codex/mgd-predictive-04217']
    paths: ['mgd_reader_template_probe441.py', '.github/workflows/mgd-reader-template-probe441.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install litert-lm==0.18.0 huggingface_hub
      - run: python mgd_reader_template_probe441.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-reader-template-probe441
          path: mgd-reader-template-probe-results
