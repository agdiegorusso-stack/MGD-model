name: MGD Studio axiom native delivery
on:
  push:
    branches: ['codex/mgd-studio-axioms-0430']
    paths:
      - '.github/workflows/mgd-axioms0430-native.yml'
      - 'delivery0430/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mgd-axioms0430-verified-delivery
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-axioms-signing-v1
      - name: Restore the previously retained reader payload and golden references
        uses: actions/download-artifact@v4
        with:
          name: MGD-Studio-0430-source
          run-id: 38553162171
          github-token: ${{ github.token }}
          path: retained-0430
      - name: Apply the delivered production fixes and retain provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile,hashlib,json,subprocess
          root=Path('mgd-neural-0421'); reports=root/'tool/reports';reports.mkdir(parents=True,exist_ok=True)
          restored=[]
          with zipfile.ZipFile('retained-0430/MGD-Studio-0430-source.zip') as z:
              for name in z.namelist():
                  pure=PurePosixPath(name)
                  if pure.is_absolute() or '..' in pure.parts or name.endswith('/'): continue
                  if not any(name.startswith(p) for p in ('mgd-neural-0421/assets/','mgd-neural-0421/tool/fixtures/','mgd-neural-0421/test/goldens/')): continue
                  p=Path(name);data=z.read(name)
                  if p.exists():
                      assert p.read_bytes()==data, 'Retained payload differs: '+name
                  else:
                      p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                  restored.append({'path':name,'sha256':hashlib.sha256(data).hexdigest()})
          (reports/'restored-payload0430.json').write_text(json.dumps(restored,indent=2))
          (reports/'BUILD-COMMIT.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
          git apply --check delivery0430/production_fix.patch
          git apply delivery0430/production_fix.patch
          git diff --binary > mgd-neural-0421/tool/reports/applied-source0430.diff
          sha256sum delivery0430/production_fix.patch > mgd-neural-0421/tool/reports/patch-sha256.txt
      - name: Analyze, run ALL regressions, compile and verify the ARM64 APK
        id: verified_build
        run: bash delivery0430/build_android.sh
      - name: Summarize evidence and preserve the exact compiled source
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib
          root=Path('mgd-neural-0421');reports=root/'tool/reports';reports.mkdir(parents=True,exist_ok=True)
          p=reports/'full-tests0430.jsonl';events=[]
          if p.is_file():
              for line in p.read_text(errors='replace').splitlines():
                  try:x=json.loads(line)
                  except ValueError:continue
                  if isinstance(x,dict):events.append(x)
          done=[e for e in events if e.get('type')=='testDone' and not e.get('hidden')]
          summary={'test_done':len(done),'success':sum(e.get('result')=='success' for e in done),'failures':sum(e.get('result') not in ('success','skipped') for e in done),'errors':sum(e.get('type')=='error' for e in events),'runner_done':next((e for e in reversed(events) if e.get('type')=='done'),None),'goldens_updated':False,'physical_phone_tested':False}
          (reports/'summary0430.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          paths=[]
          for base in [root,Path('delivery0430')]:
              for p in base.rglob('*'):
                  if not p.is_file() or any(s in p.parts for s in ('build','.dart_tool','.gradle','output','prior-ci-38553162171','reports')):continue
                  if p.suffix.lower() in ('.ttf','.otf','.woff','.woff2','.keystore','.jks','.apk','.litertlm','.gguf','.safetensors'):continue
                  if p.name in ('local.properties','key.properties') or p.stat().st_size>200000000:continue
                  paths.append(p)
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          (reports/'source-manifest0430.json').write_text(json.dumps(manifest,indent=2))
          with zipfile.ZipFile('MGD-Studio-0430-compiled-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Studio-0430-verification
          path: mgd-neural-0421/tool/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Studio-0430-compiled-source
          path: MGD-Studio-0430-compiled-source.zip
      - uses: actions/upload-artifact@v4
        if: steps.verified_build.outcome == 'success'
        with:
          name: MGD-Studio-0430-APK
          path: delivery0430/output/MGD-Studio-Assiomi-0.43.0-arm64.apk
          if-no-files-found: error
