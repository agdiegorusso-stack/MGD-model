name: MGD Studio axiom native delivery
on:
  push:
    branches: ['codex/mgd-studio-axioms-0430']
    paths: ['.github/workflows/mgd-axioms0430-native.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      MGD_APPLICATION_ID: it.diegorusso.mgdneurostable.studio.axioms
      MGD_APPLICATION_LABEL: MGD Studio Assiomi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-axioms-signing-v1
      - name: Use documented Message text conversion and disable automatic tool calling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mgd-neural-0421/android/app/src/main/kotlin/it/diegorusso/mgd_neuro_mobile/AxiomTeacherBridge.kt')
          s=p.read_text().replace('session.sendMessage(prompt).text','session.sendMessage(prompt).toString()')
          s=s.replace('ConversationConfig(systemInstruction=Contents.of(system),','ConversationConfig(systemInstruction=Contents.of(system),automaticToolCalling=false,')
          p.write_text(s)
          PY
          git diff --exit-code 94d6a069369c488e44b30fb7fb952cc1f471fad8 -- mgd-neural-0421/lib mgd-neural-0421/test
          git config user.name 'MGD build integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Use LiteRT Message.toString and disable autonomous tool calls [skip ci]'
            git push origin HEAD:codex/mgd-studio-axioms-0430
          fi
          mkdir -p mgd-neural-0421/tool/reports
          git rev-parse HEAD > mgd-neural-0421/tool/reports/BUILD-COMMIT.txt
          printf '94d6a069369c488e44b30fb7fb952cc1f471fad8\n' > mgd-neural-0421/tool/reports/IDENTICAL-DART-SOURCE.txt
          printf 'matching_original_signature=false; side-by-side installation\n' > mgd-neural-0421/tool/reports/install-mode.txt
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3
      - uses: actions/download-artifact@v4
        with:
          name: MGD-443-factorized-reader-training
          run-id: 38176357502
          github-token: ${{ github.token }}
          path: research/mgd443_reader/results
      - run: python research/mgd443_reader/prepare_app.py
      - name: Resolve dependencies
        working-directory: mgd-neural-0421
        run: flutter pub get
      - name: Analyze full app
        working-directory: mgd-neural-0421
        run: set -o pipefail; flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee tool/reports/analyze0430.log
      - name: Axiom core
        working-directory: mgd-neural-0421
        run: set -o pipefail; flutter test test/axioms0430_test.dart --machine 2>&1 | tee tool/reports/axiom-tests0430.jsonl
      - name: Axiom persistence
        working-directory: mgd-neural-0421
        run: set -o pipefail; flutter test test/axioms0430_store_test.dart --machine 2>&1 | tee tool/reports/axiom-store0430.jsonl
      - name: Axiom screens
        working-directory: mgd-neural-0421
        run: set -o pipefail; flutter test test/axioms0430_widget_test.dart --update-goldens --machine 2>&1 | tee tool/reports/axiom-widget0430.jsonl
      - name: Build ARM64 APK
        id: build
        working-directory: mgd-neural-0421
        run: set -o pipefail; flutter build apk --release --target-platform android-arm64 2>&1 | tee tool/reports/build0430.log
      - name: Inspect and verify the real APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=mgd-neural-0421/build/app/outputs/flutter-apk/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" > mgd-neural-0421/tool/reports/apk-signature0430.txt
          "$tools/aapt" dump badging "$apk" > mgd-neural-0421/tool/reports/apk-identity0430.txt
          python - <<'PY'
          import os,pathlib,zipfile,hashlib,json
          root=pathlib.Path('mgd-neural-0421');p=root/'build/app/outputs/flutter-apk/app-release.apk'
          text=(root/'tool/reports/apk-identity0430.txt').read_text()
          assert "name='it.diegorusso.mgdneurostable.studio.axioms'" in text
          assert "versionName='0.43.0'" in text and "versionCode='110'" in text
          with zipfile.ZipFile(p) as z:
              assert 'assets/flutter_assets/assets/reader443.json' in z.namelist()
              assert not any(n.endswith(('.litertlm','.gguf','.safetensors')) for n in z.namelist())
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'tool/reports/apk0430.json').write_text(json.dumps({'application_id':os.environ['MGD_APPLICATION_ID'],'version':'0.43.0','build':110,'bytes':p.stat().st_size,'sha256':h,'teacher_weights_bundled':False,'physical_phone_inference_tested':False},indent=2))
          (root/'tool/reports/APK-SHA256.txt').write_text(h+'\n')
          PY
      - name: Preserve complete sources and evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,subprocess
          root=pathlib.Path('mgd-neural-0421');reports=root/'tool/reports';reports.mkdir(parents=True,exist_ok=True);summary={}
          for p in reports.glob('*0430.jsonl'):
              ev=[]
              for line in p.read_text(errors='replace').splitlines():
                  try:x=json.loads(line)
                  except Exception:continue
                  if isinstance(x,dict):ev.append(x)
              done=[e for e in ev if e.get('type')=='testDone' and not e.get('hidden')]
              summary[p.name]={'test_done':len(done),'success':sum(e.get('result')=='success' for e in done),'errors':sum(e.get('type')=='error' for e in ev),'runner_done':next((e for e in reversed(ev) if e.get('type')=='done'),None)}
          (reports/'summary0430.json').write_text(json.dumps(summary,indent=2))
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          paths += [str(p) for p in (root/'assets').glob('*') if p.is_file()]
          paths += [str(p) for p in (root/'tool/fixtures').glob('*') if p.is_file()]
          paths += [str(p) for p in (root/'test/goldens').glob('axioms0430*.png')]
          with zipfile.ZipFile('MGD-Studio-0430-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(paths)):
                  p=pathlib.Path(name)
                  if p.is_file() and p.stat().st_size<200000000 and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.keystore','.jks'}:z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Studio-0430-verification
          path: |
            mgd-neural-0421/tool/reports
            mgd-neural-0421/test/goldens/axioms0430*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-Studio-0430-source
          path: MGD-Studio-0430-source.zip
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: MGD-Studio-0430-APK
          path: mgd-neural-0421/build/app/outputs/flutter-apk/app-release.apk
