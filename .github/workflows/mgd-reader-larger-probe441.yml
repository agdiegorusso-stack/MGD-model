name: MGD 4B reader runtime feasibility
on:
  push:
    branches: ['codex/mgd-predictive-04217']
    paths: ['mgd_reader_larger_probe441.py', '.github/workflows/mgd-reader-larger-probe441.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install litert-lm==0.18.0 huggingface_hub
      - run: python mgd_reader_larger_probe441.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGD-larger-reader-probe441
          path: mgd-reader-larger-probe-results
