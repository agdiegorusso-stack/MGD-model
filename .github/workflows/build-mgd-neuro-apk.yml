name: Build MGD-Neuro Android APK

on:
  push:
    branches: [ mgd-neuro-mobile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore app sources
        run: |
          mkdir -p mgd-neuro-app
          cat mgd-neuro/v05/v05s*.b64 | base64 -d > /tmp/mgd-neuro-src.tar.gz
          tar -xzf /tmp/mgd-neuro-src.tar.gz -C mgd-neuro-app
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mgd-neuro-app/lib/plastic_language_brain_v04.dart")
          s = p.read_text()
          s = s.replace("'ha', 'ho', 'hai', 'hanno', 'aveva', 'hanno'", "'ha', 'ho', 'hai', 'hanno', 'aveva'")
          s = s.replace("margin >= 0.045 || bestScore >= 0.72", "margin >= 0.010 || bestScore >= 0.68")
          s = s.replace(
              "    if (feature == 'ctx:deictic') return 0.45;",
              "    if (feature == 'ctx:deictic') return 0.45;\n"
              "    if (feature == 'frame:deictic-bare') return 1.10;"
          )
          s = s.replace(
              "    if (hasDeictic || subjectId == userId || subjectId == selfId) {\n"
              "      candidates.add('ctx:deictic');\n"
              "    }\n\n"
              "    for (var i = 0; i + 1 < contentForBigrams.length; i++) {",
              "    if (hasDeictic || subjectId == userId || subjectId == selfId) {\n"
              "      candidates.add('ctx:deictic');\n"
              "      final hasLexicalRole = candidates.any((f) => f.startsWith('lex:'));\n"
              "      if (!hasLexicalRole) candidates.add('frame:deictic-bare');\n"
              "    }\n\n"
              "    for (var i = 0; i + 1 < contentForBigrams.length; i++) {"
          )
          p.write_text(s)
          PY

      - name: Upload restored source
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.5-source
          path: |
            mgd-neuro-app/lib
            mgd-neuro-app/test
            mgd-neuro-app/pubspec.yaml
          retention-days: 7

      - name: Generate Android project
        working-directory: mgd-neuro-app
        run: |
          flutter create . --platforms=android --project-name=mgd_neuro_mobile --org=it.diegorusso
          rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get

      - name: Test
        working-directory: mgd-neuro-app
        run: flutter test

      - name: Analyze
        working-directory: mgd-neuro-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mgd-neuro-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.5-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
