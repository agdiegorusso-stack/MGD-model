name: Build MGD-Neuro Android APK

on:
  push:
    branches: [ mgd-neuro-mobile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore app sources
        run: |
          mkdir -p mgd-neuro-app
          cat mgd-neuro/v05s000.b64 mgd-neuro/v05s001.b64 mgd-neuro/v05s002.b64 mgd-neuro/v05s003.b64 mgd-neuro/v05s0040.b64 mgd-neuro/v05s0041.b64 mgd-neuro/v05s005.b64 mgd-neuro/v05s006.b64 mgd-neuro/v05s007.b64 mgd-neuro/v05s008.b64 mgd-neuro/source.part03.b64 mgd-neuro/source.part04.b64 | base64 -d > /tmp/mgd-neuro-src.tar.gz
          tar -xzf /tmp/mgd-neuro-src.tar.gz -C mgd-neuro-app

      - name: Generate Android project
        working-directory: mgd-neuro-app
        run: |
          flutter create . --platforms=android --project-name=mgd_neuro_mobile --org=it.diegorusso
          rm -f test/widget_test.dart

      - name: Get dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get

      - name: Test
        working-directory: mgd-neuro-app
        run: flutter test

      - name: Analyze
        working-directory: mgd-neuro-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mgd-neuro-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
