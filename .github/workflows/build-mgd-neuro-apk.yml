name: Build MGD-Neuro Android APK

on:
  push:
    branches: [ mgd-neuro-mobile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-neuro-prototype-signing-v1

      - name: Ensure stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=MGD Neuro Prototype,O=MGD Neuro,C=IT"               -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "Stable signing certificate:"
          SIGNING_INFO="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey)"
          echo "$SIGNING_INFO" | grep -E "Owner:|SHA256:"
          EXPECTED_SHA256="BF:D6:E2:66:0A:3C:3A:6E:3B:37:D1:73:6E:16:19:77:7B:93:3E:97:6C:31:2C:5B:1C:6C:D3:8E:90:8F:15:89"
          echo "$SIGNING_INFO" | grep -F "$EXPECTED_SHA256" >/dev/null || {
            echo "ERROR: Android signing key changed. Refusing to build an APK that would break upgrades."
            exit 1
          }

      - name: Restore 0.5 base and apply 0.5.1 repair
        run: |
          mkdir -p mgd-neuro-app
          cat mgd-neuro/v05/v05s*.b64 | base64 -d > /tmp/mgd-neuro-src.tar.gz
          tar -xzf /tmp/mgd-neuro-src.tar.gz -C mgd-neuro-app
          python3 mgd-neuro/patch_v051.py mgd-neuro-app

      - name: Apply 0.6 multimodal MGD overlay
        run: |
          mkdir -p /tmp/mgd-v06
          cat mgd-neuro/v06/v06s*.b64 | base64 -d > /tmp/mgd-v06.tar.gz
          tar -xzf /tmp/mgd-v06.tar.gz -C /tmp/mgd-v06
          cp /tmp/mgd-v06/lib/sensory_world_v06.dart mgd-neuro-app/lib/
          cp /tmp/mgd-v06/lib/world_persistence_v06.dart mgd-neuro-app/lib/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mgd-neuro-app/lib/sensory_world_v06.dart")
          s = p.read_text()
          s = s.replace("class MgdWorld06 {\n  static const int version", "class MgdWorld06 {\n  MgdWorld06();\n\n  static const int version")
          p.write_text(s)
          PY
          python3 /tmp/mgd-v06/patch_v060.py mgd-neuro-app
          python3 mgd-neuro/patch_v061.py mgd-neuro-app
          base64 -d mgd-neuro/patch_v070.py.gz.b64 | gzip -d > /tmp/patch_v070.py
          python3 /tmp/patch_v070.py mgd-neuro-app
          python3 mgd-neuro/patch_v071.py mgd-neuro-app
          python3 mgd-neuro/patch_v080.py mgd-neuro-app
          python3 mgd-neuro/patch_v081.py mgd-neuro-app
          python3 mgd-neuro/patch_v082.py mgd-neuro-app
          base64 -d mgd-neuro/patch_v090.py.gz.b64 | gzip -d > /tmp/patch_v090.py
          python3 /tmp/patch_v090.py mgd-neuro-app
          python3 mgd-neuro/patch_v091.py mgd-neuro-app
          python3 mgd-neuro/patch_v010.py mgd-neuro-app
          base64 -d mgd-neuro/v11/web_knowledge_explorer_v11.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/web_knowledge_explorer_v11.dart
          base64 -d mgd-neuro/v11/research_persistence_v11.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/research_persistence_v11.dart
          base64 -d mgd-neuro/v11/web_knowledge_explorer_v11_test.dart.gz.b64 | gzip -d > mgd-neuro-app/test/web_knowledge_explorer_v11_test.dart
          base64 -d mgd-neuro/patch_v011.py.gz.b64 | gzip -d > /tmp/patch_v011.py
          python3 /tmp/patch_v011.py mgd-neuro-app
          python3 mgd-neuro/patch_v011a.py mgd-neuro-app
          echo "Decoding brain_admin_v012"
          (base64 -d mgd-neuro/v12/brain_admin_v012.dart.gz.b64 | gzip -dc > mgd-neuro-app/lib/brain_admin_v012.dart) || test -s mgd-neuro-app/lib/brain_admin_v012.dart
          echo "Decoding knowledge_snapshot_v012"
          (base64 -d mgd-neuro/v12/knowledge_snapshot_v012.dart.gz.b64 | gzip -dc > mgd-neuro-app/lib/knowledge_snapshot_v012.dart) || test -s mgd-neuro-app/lib/knowledge_snapshot_v012.dart
          echo "Decoding knowledge_editor_v012"
          (base64 -d mgd-neuro/v12/knowledge_editor_v012.dart.gz.b64 | gzip -dc > mgd-neuro-app/lib/knowledge_editor_v012.dart) || test -s mgd-neuro-app/lib/knowledge_editor_v012.dart
          echo "Decoding patch_v012"
          (base64 -d mgd-neuro/patch_v012.py.gz.b64 | gzip -dc > /tmp/patch_v012.py) || test -s /tmp/patch_v012.py
          python3 -m py_compile /tmp/patch_v012.py
          python3 /tmp/patch_v012.py mgd-neuro-app
          python3 mgd-neuro/patch_v012a.py mgd-neuro-app
          python3 mgd-neuro/patch_v012b.py mgd-neuro-app
          python3 mgd-neuro/patch_v012c.py mgd-neuro-app
          (base64 -d mgd-neuro/v13/navigable_graph_v013.dart.gz.b64 | gzip -dc > mgd-neuro-app/lib/navigable_graph_v013.dart) || test -s mgd-neuro-app/lib/navigable_graph_v013.dart
          python3 mgd-neuro/patch_v013.py mgd-neuro-app
          base64 -d mgd-neuro/patch_v014.py.gz.b64 | gzip -d > /tmp/patch_v014.py
          python3 /tmp/patch_v014.py mgd-neuro-app
          python3 mgd-neuro/patch_v015.py mgd-neuro-app
          base64 -d mgd-neuro/v16/multimodal_concept_v016.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/multimodal_concept_v016.dart
          base64 -d mgd-neuro/v16/mgd_scaling_lab_v016.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/mgd_scaling_lab_v016.dart
          base64 -d mgd-neuro/v16/multimodal_scaling_v016_test.dart.gz.b64 | gzip -d > mgd-neuro-app/test/multimodal_scaling_v016_test.dart
          base64 -d mgd-neuro/patch_v016.py.gz.b64 | gzip -d > /tmp/patch_v016.py
          python3 /tmp/patch_v016.py mgd-neuro-app
          base64 -d mgd-neuro/v17/navigable_graph_v017.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/navigable_graph_v013.dart
          base64 -d mgd-neuro/v17/mgd_scaling_lab_v017.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/mgd_scaling_lab_v016.dart
          base64 -d mgd-neuro/v17/persistence_v017.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/persistence.dart
          base64 -d mgd-neuro/v17/world_persistence_v017.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/world_persistence_v06.dart
          base64 -d mgd-neuro/v17/research_persistence_v017.dart.gz.b64 | gzip -d > mgd-neuro-app/lib/research_persistence_v11.dart
          base64 -d mgd-neuro/patch_v017.py.gz.b64 | gzip -d > /tmp/patch_v017.py
          python3 -m py_compile /tmp/patch_v017.py
          python3 /tmp/patch_v017.py mgd-neuro-app
          base64 -d mgd-neuro/patch_v018.py.gz.b64 | gzip -d > /tmp/patch_v018.py
          python3 -m py_compile /tmp/patch_v018.py
          python3 /tmp/patch_v018.py mgd-neuro-app
          echo "Decoding MGD Language 0.20"
          (base64 -d mgd-neuro/v20/mgd_language_v020.dart.gz.b64 | gzip -dc > mgd-neuro-app/lib/mgd_language_v020.dart) || test -s mgd-neuro-app/lib/mgd_language_v020.dart
          (base64 -d mgd-neuro/v20/mgd_language_v020_test.dart.gz.b64 | gzip -dc > mgd-neuro-app/test/mgd_language_v020_test.dart) || test -s mgd-neuro-app/test/mgd_language_v020_test.dart
          (base64 -d mgd-neuro/patch_v020.py.gz.b64 | gzip -dc > /tmp/patch_v020.py) || test -s /tmp/patch_v020.py
          python3 -m py_compile /tmp/patch_v020.py
          python3 /tmp/patch_v020.py mgd-neuro-app
          python3 mgd-neuro/patch_v020a.py mgd-neuro-app
          python3 mgd-neuro/patch_v020b.py mgd-neuro-app
          python3 mgd-neuro/patch_v020c.py mgd-neuro-app
          python3 mgd-neuro/patch_v020d.py mgd-neuro-app
          python3 mgd-neuro/patch_v020e.py mgd-neuro-app
          python3 mgd-neuro/patch_v020f.py mgd-neuro-app
          python3 mgd-neuro/patch_v020g.py mgd-neuro-app
          python3 mgd-neuro/patch_v020h.py mgd-neuro-app
          python3 mgd-neuro/patch_v020i.py mgd-neuro-app
          python3 mgd-neuro/patch_v020j.py mgd-neuro-app
          python3 mgd-neuro/patch_v020k.py mgd-neuro-app
          python3 mgd-neuro/patch_v021.py mgd-neuro-app
          python3 mgd-neuro/patch_v021a.py mgd-neuro-app
          cat mgd-neuro/patch_v022.py.b64.* | base64 -d > /tmp/patch_v022.py
          python3 -m py_compile /tmp/patch_v022.py
          python3 /tmp/patch_v022.py mgd-neuro-app
          python3 mgd-neuro/patch_v022a.py mgd-neuro-app
          python3 mgd-neuro/patch_v023_min.py mgd-neuro-app
          cat mgd-neuro/patch_v024.py.b64.* | base64 -d > /tmp/patch_v024.py
          python3 -m py_compile /tmp/patch_v024.py
          python3 /tmp/patch_v024.py mgd-neuro-app
          python3 mgd-neuro/patch_v024fix.py mgd-neuro-app
          cat mgd-neuro/patch_v025c.py.b64.* | base64 -d > /tmp/patch_v025c.py
          python3 -m py_compile /tmp/patch_v025c.py
          python3 /tmp/patch_v025c.py mgd-neuro-app
          python3 mgd-neuro/patch_v025fix.py mgd-neuro-app
          python3 mgd-neuro/patch_v0251.py mgd-neuro-app
          python3 mgd-neuro/patch_v0252.py mgd-neuro-app
          python3 mgd-neuro/patch_v0252a.py mgd-neuro-app
          python3 mgd-neuro/patch_v0252b.py mgd-neuro-app
          cat mgd-neuro/patch_v026.py.gz.b64.* | base64 -d | gzip -dc > /tmp/patch_v026.py
          python3 -m py_compile /tmp/patch_v026.py
          python3 /tmp/patch_v026.py mgd-neuro-app

      - name: Generate Android project and permissions
        working-directory: mgd-neuro-app
        run: |
          flutter create . --platforms=android --project-name=mgd_neuro_mobile --org=it.diegorusso
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          s = gradle.read_text()
          s = s.replace(
              'applicationId = "it.diegorusso.mgd_neuro_mobile"',
              'applicationId = "it.diegorusso.mgdneurostable"'
          )
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          stable_signing = (
              '    signingConfigs {\n'
              '        create("mgdStable") {\n'
              '            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")\n'
              '            storePassword = "android"\n'
              '            keyAlias = "androiddebugkey"\n'
              '            keyPassword = "android"\n'
              '        }\n'
              '    }\n\n'
          )
          if 'create("mgdStable")' not in s:
              s = s.replace('    buildTypes {', stable_signing + '    buildTypes {', 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("mgdStable")'
          )
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if 'android.permission.RECORD_AUDIO' not in m:
              m = m.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
              )
          if 'android.permission.INTERNET' not in m:
              m = m.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />'
              )
          manifest.write_text(m)
          PY

      - name: Get dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get

      - name: Validate distillation tool
        run: python3 -m py_compile mgd-neuro/tools/distill_llm_to_mgd.py

      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-source
          path: |
            mgd-neuro-app/lib
            mgd-neuro-app/test
            mgd-neuro-app/pubspec.yaml
          retention-days: 7

      - name: Test
        working-directory: mgd-neuro-app
        run: flutter test

      - name: Analyze
        working-directory: mgd-neuro-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mgd-neuro-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
