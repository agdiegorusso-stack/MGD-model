name: Build MGD-Neuro Android APK

on:
  push:
    branches: [ mgd-neuro-mobile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgd-neuro-prototype-signing-v1

      - name: Ensure stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=MGD Neuro Prototype,O=MGD Neuro,C=IT"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Restore and patch app sources
        run: |
          mkdir -p mgd-neuro-app
          cat mgd-neuro/v05/v05s*.b64 | base64 -d > /tmp/mgd-neuro-src.tar.gz
          tar -xzf /tmp/mgd-neuro-src.tar.gz -C mgd-neuro-app
          python3 mgd-neuro/patch_v051.py mgd-neuro-app

      - name: Generate Android project
        working-directory: mgd-neuro-app
        run: |
          flutter create . --platforms=android --project-name=mgd_neuro_mobile --org=it.diegorusso
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'applicationId = "it.diegorusso.mgd_neuro_mobile"',
              'applicationId = "it.diegorusso.mgdneurostable"'
          )
          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: mgd-neuro-app
        run: flutter pub get

      - name: Test
        working-directory: mgd-neuro-app
        run: flutter test

      - name: Analyze
        working-directory: mgd-neuro-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mgd-neuro-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGD-Neuro-0.5.1-Stable-Android
          path: mgd-neuro-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
